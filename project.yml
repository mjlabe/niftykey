name: NiftyKey
options:
  bundleIdPrefix: com.niftykey
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""

packages:
  SharedModels:
    path: Packages/SharedModels
  KeyboardCore:
    path: Packages/KeyboardCore
  ThemeEngine:
    path: Packages/ThemeEngine
  PredictionEngine:
    path: Packages/PredictionEngine
  SwipeEngine:
    path: Packages/SwipeEngine

targets:
  NiftyKey:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.niftykey.app
        CODE_SIGN_ENTITLEMENTS: App/NiftyKey.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SharedModels
      - package: ThemeEngine
      - package: PredictionEngine
      - target: NiftyKeyboard

  NiftyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
    settings:
      base:
        INFOPLIST_FILE: Keyboard/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.niftykey.app.keyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/NiftyKeyboard.entitlements
    dependencies:
      - package: SharedModels
      - package: KeyboardCore
      - package: ThemeEngine
      - package: PredictionEngine
      - package: SwipeEngine

schemes:
  NiftyKey:
    build:
      targets:
        NiftyKey: all
        NiftyKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
